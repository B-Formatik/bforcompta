name: Construire B-S@fe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: construire
  cancel-in-progress: true

jobs:
  apk:
    name: Application Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer Capacitor
        run: npm install --no-audit --no-fund
      - name: Préparer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          for P in CAMERA ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION RECORD_AUDIO; do
            sed -i "/android.permission.INTERNET/a\    <uses-permission android:name=\"android.permission.$P\" />" $M
          done
          sed -i 's#</manifest>#    <queries>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n    </queries>\n</manifest>#' $M
          cat $M
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk B-ForCompta.apk
      - name: Publier l'APK (dernière version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: B-S@fe 1.0.${{ github.run_number }}
          body: APK Android de B-S@fe (B-Form@tik). Téléchargez B-ForCompta.apk sur le téléphone puis installez-le.
          files: B-ForCompta.apk
          make_latest: true

  web:
    name: Version web (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploiement
        uses: actions/deploy-pages@v4
